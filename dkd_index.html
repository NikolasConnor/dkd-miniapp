<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>ДКДУСЛУГИ</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#191e29;--line:#2b3241;--text:#f4f6fb;--muted:#9da7ba;--accent:#b8f36b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202a37 0,#10131b 48%);color:var(--text);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{width:min(760px,100%);margin:auto;padding:24px 16px 48px}.top{display:flex;align-items:center;gap:14px;margin:8px 0 26px}.logo{width:48px;height:48px;border-radius:16px;background:var(--accent);color:#141a11;display:grid;place-items:center;font-weight:900;font-size:21px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand{font-size:20px;font-weight:850;letter-spacing:.02em}.hero{padding:25px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#202735,#171b25);margin-bottom:18px}.hero h1{font-size:clamp(27px,6vw,40px);line-height:1.08;letter-spacing:-.04em;margin:8px 0 12px}.hero p{color:var(--muted);margin:0;max-width:520px}.status{display:inline-flex;align-items:center;gap:8px;border:1px solid #34432d;background:#202c1c;color:var(--accent);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:135px;text-align:left;padding:19px;border:1px solid var(--line);border-radius:19px;background:var(--panel);color:var(--text);cursor:pointer;transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-2px);border-color:#69758a}.tile .emoji{font-size:24px}.tile h2{font-size:16px;margin:13px 0 4px}.tile p{font-size:13px;color:var(--muted);margin:0}.section{display:none;margin-top:18px;padding:21px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.section.active{display:block}.section h2{margin:0 0 10px}.muted{color:var(--muted)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.btn{background:var(--accent);color:#13180e;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.notice{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}.error{color:#ffb7ad}.loading{color:var(--muted);padding:10px 0} @media(max-width:440px){main{padding:16px 13px 32px}.hero{padding:21px}.grid{gap:9px}.tile{padding:15px;min-height:130px}}
</style>
</head>
<body>
<main>
  <header class="top"><div class="logo">Д</div><div><div class="eyebrow">Мини-приложение</div><div class="brand">ДКДУСЛУГИ</div></div></header>
  <section class="hero"><span class="status"><span class="dot"></span><span id="statusText">Приложение запущено</span></span><h1>Всё важное<br>в одном месте.</h1><p>Новости, документы, партии и голосования — открой нужный раздел ниже.</p></section>
  <section class="grid" aria-label="Разделы">
    <button class="tile" data-section="news"><span class="emoji">◈</span><h2>Новости</h2><p>Последние публикации</p></button>
    <button class="tile" data-section="parties"><span class="emoji">▦</span><h2>Партии</h2><p>Список и информация</p></button>
    <button class="tile" data-section="votes"><span class="emoji">✓</span><h2>Голосования</h2><p>Решения и результаты</p></button>
    <button class="tile" data-section="documents"><span class="emoji">▤</span><h2>Документы</h2><p>Материалы и файлы</p></button>
  </section>
  <section id="content" class="section"><button class="btn" id="backBtn">← Назад</button><h2 id="sectionTitle" style="margin-top:18px"></h2><div id="sectionBody" class="loading">Загрузка…</div></section>
  <p class="notice" id="footnote">Откройте приложение через Telegram, чтобы получить доступ к персональным функциям.</p>
</main>
<script>
const names={news:'Новости',parties:'Партии',votes:'Голосования',documents:'Документы'};
const content=document.getElementById('content'), body=document.getElementById('sectionBody');
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
async function loadSection(key){
 content.classList.add('active');document.getElementById('sectionTitle').textContent=names[key]||'Раздел';
 body.className='loading';body.textContent='Загрузка…';
 try{
  const headers={};const initData=tg?.initData;if(initData)headers['X-Telegram-Init-Data']=initData;
  const response=await fetch('/api/'+key,{headers});
  const data=await response.json().catch(()=>({detail:'Сервер вернул неожиданный ответ.'}));
  if(!response.ok)throw new Error(data.detail||data.error||('Ошибка '+response.status));
  const list=Array.isArray(data)?data:(data.items||data.data||[]);
  if(!list.length){body.className='muted';body.textContent='Пока нет опубликованных материалов.';return;}
  body.className='';
  list.forEach(item=>{
   const el=document.createElement('div');el.className='item';
   const title=item.title||item.name||item.label||item.question||'Материал';
   const desc=item.description||item.text||item.content||item.date||'';
   const h=document.createElement('strong');h.textContent=title;el.appendChild(h);
   if(desc){const p=document.createElement('p');p.className='muted';p.textContent=String(desc);el.appendChild(p);}
   body.appendChild(el);
  });
 }catch(e){body.className='error';body.textContent=e.message||'Не удалось загрузить данные.';}
}
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>loadSection(b.dataset.section)));
document.getElementById('backBtn').addEventListener('click',()=>content.classList.remove('active'));
async function checkHealth(){try{const r=await fetch('/health');if(r.ok)document.getElementById('statusText').textContent='Сервис работает';}catch(_){}}
checkHealth();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
